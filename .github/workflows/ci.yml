name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when new commits land on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every platform the release ships, so a break on one of them shows up in a
  # pull request rather than in a tagged build. Clippy runs everywhere too: the
  # tray code branches on `cfg(target_os)`, which is exactly the code a
  # macOS-only lint pass would never see.
  rust:
    name: Rust on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          # 22.04 to match the release build's glibc baseline.
          - name: Linux
            runner: ubuntu-22.04
          - name: Windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.runner }}

      # Formatting is platform-independent, so one run is enough.
      - name: Formatting
        if: matrix.runner == 'macos-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than `lts/*`: Privacy Cash's SDK requires Node 24, and a
      # floating version also floats npm, which resolves optional peer
      # dependencies differently and desynchronises the lock file.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # `npm run build` is tsc followed by vite, so this typechecks too.
      - run: npm run build

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # package.json, tauri.conf.json and Cargo.toml each carry the version.
      # Catching drift here means a release tag cannot ship a mislabelled build.
      - name: Check package.json, tauri.conf.json and Cargo.toml agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json:    $pkg"
          echo "tauri.conf.json: $conf"
          echo "Cargo.toml:      $cargo_version"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo_version" ]; then
            echo "::error::Version mismatch between package.json, tauri.conf.json and Cargo.toml"
            exit 1
          fi
